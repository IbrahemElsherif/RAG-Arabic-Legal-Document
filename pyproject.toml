[project]
name = "legal-rag"
version = "0.1.0"
description = "RAG over the Egyptian Civil Code with article citations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Corpus: PDF extraction and Arabic normalization
    "pymupdf>=1.24",
    "pyarabic>=0.6.15",
    # Retrieval: bge-m3 / multilingual-e5 embeddings + Qdrant local mode
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "qdrant-client>=1.10",
    # Generation: one OpenAI-compatible client for OpenRouter and vLLM
    "openai>=1.40",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Serving: Embedder batching + ASGI mount (Phase 18)
    "bentoml>=1.3",
    # Tracing and monitoring
    "langfuse>=3.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Offline evaluation and experiment tracking. Not needed in the API image.
eval = [
    "ragas>=0.2",
    "mlflow>=2.16",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "dvc>=3.50",
    "locust>=2.31",
]

# bge-m3 runs on CPU. The CPU-only torch wheel keeps the Docker image ~4 GB smaller.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: isort, B: bugbear, UP: pyupgrade, T20: no print()
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=legal_rag --cov-report=term-missing --cov-fail-under=70"
